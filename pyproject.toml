[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-wealth-dashboard"
version = "0.1.0"
description = "Local dashboard for ingesting NPS statements from Gmail and visualizing wealth."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "pandas",
    "plotly",
    "pypdf",
    "python-dotenv",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
